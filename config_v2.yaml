# DACHP-v2 confirmatory experiment. See PREREGISTRATION.md. Fresh splits (seeds 5-9).
seeds:
- 5
- 6
- 7
- 8
- 9
sensitivity_seeds:
- 5
tuning_seed: 5
split:
  train: 0.6
  val: 0.2
  test: 0.2
datasets:
  breast_cancer:
    epochs: 200
  digits:
    epochs: 200
  mice_protein:
    epochs: 200
  anneal:
    epochs: 200
  coil20:
    epochs: 200
  cnae9:
    epochs: 200
  mnist:
    epochs: 250
    subset_per_class: 1000
  fashion_mnist:
    epochs: 250
    subset_per_class: 1000
  har:
    epochs: 250
  isolet:
    epochs: 250
  olivetti:
    epochs: 200
preprocessing:
  imputer: median
  scaler: standard
dachp:
  latent_dim: 16
  alpha: 1.2
  eps_pos: 0.05
  severe_term: true
  lambda_aux: 0.3
  tau_init: 0.07
  tau_learnable: true
  tau_clamp:
  - 0.01
  - 1.0
  dropout: 0.1
  residual: true
  capacity_rule: adaptive
  lr: 0.005
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0
  warmup_frac: 0.1
  min_lr: 1.0e-05
  grad_clip: 5.0
  minibatch_threshold: 2000
  batch_large: 512
  batch_medium: 256
  tune_grid:
    alpha:
    - 1.0
    - 1.2
    - 1.5
deep_baselines:
  supcon:
    tau: 0.1
    tune_grid:
      tau:
      - 0.05
      - 0.1
      - 0.2
      lr:
      - 0.005
      - 0.002
  triplet:
    margin: 0.2
    tune_grid:
      margin:
      - 0.1
      - 0.2
      - 0.5
      lr:
      - 0.005
      - 0.002
  proxyanchor:
    alpha: 32
    delta: 0.1
    proxy_lr_mult: 100
    tune_grid:
      delta:
      - 0.0
      - 0.1
      - 0.2
      lr:
      - 0.005
      - 0.002
  arcface:
    s: 30.0
    m: 0.5
    tune_grid:
      m:
      - 0.2
      - 0.35
      - 0.5
      lr:
      - 0.005
      - 0.002
  cosface:
    s: 30.0
    m: 0.35
    tune_grid:
      m:
      - 0.2
      - 0.35
      - 0.5
      lr:
      - 0.005
      - 0.002
  ce_mlp:
    label_smoothing: 0.0
    tune_grid:
      label_smoothing:
      - 0.0
      - 0.1
      - 0.2
      lr:
      - 0.005
      - 0.002
classical_baselines:
  pca:
    n_components: 16
  lda: {}
  tsne:
    perplexity: auto
  pacmap:
    n_neighbors: 10
  trimap: {}
  umap:
    n_neighbors: 15
    min_dist: 0.1
    pre_pca: 50
  sup_umap:
    default:
      n_neighbors: 15
      min_dist: 0.1
      pre_pca: 50
      target_weight: 0.5
    tune_grid:
      n_neighbors:
      - 5
      - 15
      - 30
      - 50
      min_dist:
      - 0.0
      - 0.1
      - 0.5
      pre_pca:
      - 50
      - none
    also_16d: true
ablation:
  variants:
  - full
  - no_sphere
  - no_hardneg
  - no_severe
  - no_aux
  - no_residual
  - uncapped
  - fixed256
  - legacy_tau
sensitivity:
  alpha:
  - 0.8
  - 1.0
  - 1.2
  - 1.5
  - 2.0
  latent_dim:
  - 8
  - 16
  - 32
  lambda_aux:
  - 0.0
  - 0.3
  - 0.5
  tau_init:
  - 0.05
  - 0.07
  - 0.1
  - 0.2
evaluation:
  knn_k: 5
  trust_k: 10
  trust_max_n: 2000
  silhouette_max_n: 5000
  monitor_every: 5
  monitor_n: 1000
deep_methods:
- dachp
- dachp_v2
- supcon
- triplet
- proxyanchor
- arcface
- cosface
- ce_mlp
classical_methods:
- pca
- lda
- sup_umap
dachp_v2:
  tau_init: 0.2
  tune_grid:
    lambda_aux:
    - 0.0
    - 0.3
    alpha:
    - 1.2
    - 1.5
    - 2.0
